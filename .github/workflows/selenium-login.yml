name: OrangeHRM Selenium Java (manual)
on:
  workflow_dispatch:

jobs:
  selenium:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 10-selenium-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 10-selenium-java/pom.xml
      - name: Run Selenium TestNG tests
        env:
          ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
          ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
        run: mvn -B test -Pheadless
      - name: Upload test reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-testng-report
          path: |
            10-selenium-java/target/surefire-reports/
            10-selenium-java/target/failure-screenshots/
          if-no-files-found: ignore
          retention-days: 7

